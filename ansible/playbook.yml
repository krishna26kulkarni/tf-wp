- name: Bootstrap EKS clusters (install helm, monitoring)
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars:
    kubeconfigs: "{{ hostvars['localhost'].kubeconfigs }}"
  tasks:
    - name: Ensure kubectl is available
      shell: |
        command -v kubectl || (echo "kubectl not found" && exit 1)
      register: kubectl_check
      failed_when: kubectl_check.rc != 0

    - name: Ensure helm is available
      shell: |
        command -v helm || (echo "helm not found" && exit 1)
      register: helm_check
      failed_when: helm_check.rc != 0

    - name: Deploy monitoring (kube-prometheus-stack) to each cluster
      vars:
        kubeconfig: "{{ item }}"
      loop: "{{ kubeconfigs }}"
      loop_control:
        label: "{{ item | basename }}"
      block:
        - name: Add prometheus-community Helm repo
          shell: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts && helm repo update
          args:
            chdir: "{{ playbook_dir }}"
          register: helm_repo
        - name: Create monitoring namespace
          shell: kubectl --kubeconfig="{{ kubeconfig }}" create ns monitoring --dry-run=client -o yaml | kubectl apply -f -
        - name: Install/Upgrade kube-prometheus-stack
          shell: >
            helm upgrade --install prometheus prometheus-community/kube-prometheus-stack
            --kubeconfig "{{ kubeconfig }}"
            --namespace monitoring
            --wait
            --timeout 10m
            --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false
          args:
            chdir: "{{ playbook_dir }}"
