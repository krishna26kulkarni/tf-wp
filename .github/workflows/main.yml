name: infra-pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  TF_WORKING_DIR: infra/terraform

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Save kubeconfigs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          mkdir -p ../ansible/kubeconfigs
          terraform output -json kubeconfig_paths > ../ansible/kubeconfigs/kubeconfigs.json
          python3 - <<'PY'
          import json, sys
          d=json.load(open('kubeconfigs.json'))
          outdir='../ansible/kubeconfigs'
          for k,v in d.items():
              open(f'{outdir}/{k}_kubeconfig','w').write('') 
          PY

  ansible:
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip jq
          pip3 install ansible

      - name: Copy kubeconfigs from previous job workspace
        uses: actions/download-artifact@v4

      - name: Run Ansible playbook
        working-directory: infra/ansible
        run: ansible-playbook -i inventory.yml playbook.yml
